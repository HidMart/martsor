[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "martsor"
version = "0.3.0"

description = "Python library for building Soroush Plus bots and user clients."

readme = "README.md"

requires-python = ">=3.8"

license = { text = "MIT" }

authors = [
    { name = "HidMart" }
]

keywords = [
    "soroush",
    "soroushplus",
    "splus",
    "bot",
    "selfbot",
    "userbot",
    "python"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = []


[project.optional-dependencies]
self = [
    "SPlusthon>=1.1.4"
]


[project.urls]
Homepage = "https://github.com/HidMart/martsor"
Repository = "https://github.com/HidMart/martsor"
Issues = "https://github.com/HidMart/martsor/issues"


[tool.setuptools.packages.find]
include = [
    "martsor",
    "martsor.*"
]